<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction to Decimal Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .choice {
      padding: 10px 20px;
      border: 2px solid black;
      cursor: pointer;
      border-radius: 6px;
      font-size: 20px;
      background-color: #fff;
      transition: background-color 0.3s;
    }
    .choice:hover {
      background-color: #f0f0f0;
    }
    .correct {
      background-color: lightgreen !important;
    }
    .incorrect {
      background-color: lightcoral !important;
    }
    #question {
      font-size: 24px;
      margin: 20px;
    }
    .fraction {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
      margin: 0 2px;
    }
    .fraction .top {
      display: block;
      border-bottom: 1px solid #000;
      padding: 0 2px;
    }
    .fraction .bottom {
      display: block;
      padding: 0 2px;
    }
    #feedback {
      font-size: 20px;
      margin: 20px;
    }
    #starCounter {
      display: inline-block;
      margin-right: 20px;
    }
    #message {
      display: inline-block;
      height: 24px;
    }
    #hintBtn {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #hintText {
      font-size: 18px;
      margin-top: 10px;
      color: #555;
    }
    /* Long division hint styling */
    .long-division {
      margin-top: 10px;
    }
    .long-division-container {
      display: inline-flex;
      align-items: flex-end;
    }
    .divisor {
      margin-right: 5px;
      font-weight: bold;
    }
    .quotient {
      min-width: 60px;
      text-align: right;
    }
    .dividend {
      border-top: 2px solid #000;
      padding-left: 5px;
    }
    .flip-animation {
      display: inline-block;
      animation: flip 1s ease;
    }
    @keyframes flip {
      from { transform: rotate(0deg); }
      to { transform: rotate(180deg); }
    }
  </style>
</head>
<body>
  <h1>Fraction to Decimal Converter</h1>
  <div id="question"></div>
  <button id="hintBtn">Show Hint</button>
  <div id="hintText" style="display:none;"></div>
  <div class="choices" id="choices"></div>
  <div id="feedback">
    <span id="starCounter">⭐ 0</span>
    <span id="message"></span>
  </div>
  
  <script>
    var starCount = 0;
    function updateStarCounter() {
      document.getElementById("starCounter").innerHTML = "⭐ " + starCount;
    }
    
    // Render a fraction with a numerator over a denominator (vinculum line)
    function renderFraction(numerator, denominator) {
      return '<span class="fraction"><span class="top">' + numerator + '</span><span class="bottom">' + denominator + '</span></span>';
    }
    
    // Render a long division hint with the divisor on the left and a vinculum line over the dividend only
    function renderLongDivisionHint(numerator, denominator) {
      return '<div class="long-division">' +
             '<div class="long-division-container">' +
             '<div class="divisor">' + denominator + '</div>' +
             '<div>' +
             '<div class="quotient">&nbsp;</div>' +
             '<div class="dividend">' + numerator + '.000</div>' +
             '</div>' +
             '</div>' +
             '</div>';
    }
    
    // Fisher-Yates shuffle to randomize answer choices
    function shuffleArray(array) {
      for (var i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
    }
    
    // Generate a new fraction-to-decimal question
    function generateQuestion() {
      document.getElementById("message").innerHTML = "";
      document.getElementById("hintText").style.display = "none";
      
      // Use a simpler set of denominators until 3 stars, then switch to the extended list
      var denominators;
      if (starCount < 3) {
        denominators = [2, 3, 4, 5, 6, 8, 10];
      } else {
        denominators = [2, 4, 5, 8, 10, 20, 25, 40, 50, 100, 125, 200, 250, 500, 1000];
      }
      
      var denominator = denominators[Math.floor(Math.random() * denominators.length)];
      // Choose a numerator that gives a variety of fractions
      var numerator = Math.floor(Math.random() * (denominator * 2 - 1)) + 1;
      
      var fractionDisplay = renderFraction(numerator, denominator);
      var questionText = "Convert " + fractionDisplay + " to a decimal:";
      
      // Calculate the correct decimal answer (always shown with three decimals)
      var correctDecimal = (numerator / denominator).toFixed(3);
      
      // Prepare the long division hint without revealing the answer
      var longDivisionDisplay = renderLongDivisionHint(numerator, denominator);
      var hintMsg = "Hint: Set up the long division below and divide the numerator by the denominator.<br><br>" + longDivisionDisplay;
      document.getElementById("hintText").innerHTML = hintMsg;
      
      // Generate answer choices (one correct answer and three distractors)
      var choices = [];
      choices.push(correctDecimal);
      while (choices.length < 4) {
        var offset = (Math.random() < 0.5 ? 0.1 : -0.1) * (Math.floor(Math.random() * 3) + 1);
        var candidate = (parseFloat(correctDecimal) + offset).toFixed(3);
        if (choices.indexOf(candidate) === -1 && candidate !== correctDecimal) {
          choices.push(candidate);
        }
      }
      shuffleArray(choices);
      
      document.getElementById("question").innerHTML = questionText;
      var choicesDiv = document.getElementById("choices");
      choicesDiv.innerHTML = "";
      for (var i = 0; i < choices.length; i++) {
        var btn = document.createElement("div");
        btn.className = "choice";
        btn.innerHTML = choices[i];
        btn.onclick = (function(selected, correct) {
          return function() {
            if (selected === correct) {
              this.classList.add("correct");
              document.getElementById("message").innerHTML = "Correct! 🎉";
              starCount++;
              updateStarCounter();
              setTimeout(generateQuestion, 1000);
            } else {
              this.classList.add("incorrect");
              document.getElementById("message").innerHTML = "Incorrect! ❌";
              starCount--;
              updateStarCounter();
            }
          };
        })(choices[i], correctDecimal);
        choicesDiv.appendChild(btn);
      }
    }
    
    document.getElementById("hintBtn").addEventListener("click", function() {
      var hintDiv = document.getElementById("hintText");
      hintDiv.style.display = (hintDiv.style.display === "none") ? "block" : "none";
    });
    
    window.onload = function() {
      updateStarCounter();
      generateQuestion();
    };
  </script>
</body>
</html>
